<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>収支報告書</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="controls no-print" style="text-align: center; margin-bottom: 20px;">
        <button id="print-btn" class="success-btn">📄 PDF出力 (印刷)</button>
        <p class="hint">※PDF出力時は、印刷設定で「用紙サイズ: A4」「余白: なし」「背景のグラフィック: オン」を推奨します。</p>
    </div>

    <div class="page" id="report-page">
        <h1>収支報告書</h1>
        
        <div class="header-info">
            <div class="info-group">
                <label>対象期間:</label>
                <input type="month" id="period-start"> ～ <input type="month" id="period-end">
            </div>
            <div class="info-group">
                <label>報告者:</label>
                <input type="text" id="reporter-name" value="水上イリス (ICCHAMA)" placeholder="名前を入力">
            </div>
        </div>

        <div class="summary-section">
            <table class="summary-table">
                <tr>
                    <th>収入合計 (A)</th>
                    <th>支出合計 (B)</th>
                    <th>差引残高 (A - B)</th>
                </tr>
                <tr>
                    <td id="total-income">¥0</td>
                    <td id="total-expense">¥0</td>
                    <td id="total-balance">¥0</td>
                </tr>
            </table>
        </div>

        <h2 class="section-title">【 収入の部 】</h2>
        <table class="details-table">
            <thead>
                <tr>
                    <th style="width: 15%;">日付</th>
                    <th style="width: 60%;">摘要（内容）</th>
                    <th style="width: 20%;">金額 (円)</th>
                    <th class="no-print" style="width: 5%;">操作</th>
                </tr>
            </thead>
            <tbody id="income-table-body">
                </tbody>
        </table>
        <div class="controls no-print" style="margin-bottom: 30px;">
            <button id="add-income-btn" class="primary-btn">＋ 収入の項目を追加</button>
        </div>

        <h2 class="section-title">【 支出の部 】</h2>
        <table class="details-table">
            <thead>
                <tr>
                    <th style="width: 15%;">日付</th>
                    <th style="width: 60%;">摘要（内容）</th>
                    <th style="width: 20%;">金額 (円)</th>
                    <th class="no-print" style="width: 5%;">操作</th>
                </tr>
            </thead>
            <tbody id="expense-table-body">
                </tbody>
        </table>
        <div class="controls no-print">
            <button id="add-expense-btn" class="primary-btn">＋ 支出の項目を追加</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
